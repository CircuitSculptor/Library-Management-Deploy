services:

  user-service:
    image: ghcr.io/meeeiiike/user-service/app:latest
    env_file: ./.env
    depends_on:
      - user-db
    ports:
      - "8080:8080" #8083:8081
    networks:
      - labnet
    restart: unless-stopped

  user-db:
    image: postgres:17-alpine
    env_file: ./.env
    ports:
      - "5433:5432"
    volumes:
      - user-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - labnet

  ###########################################################

  book-service:
    image: ghcr.io/meeeiiike/book-service/app:latest
    env_file: ./.env
    ports:
      - "8081:8081"
    networks:
      - labnet

  loans-service:
    image: ghcr.io/meeeiiike/loan-service/app:latest
    env_file: ./.env
    depends_on:
      - notification-service
      - user-service
    ports:
      - "8082:8082"
    networks:
      - labnet

  notification-service:
    image: ghcr.io/meeeiiike/notification-service/app:latest
    env_file: ./.env
    ports:
      - "8083:8083" #8084:8081
    networks:
      - labnet

volumes:
  user-postgres-data:

networks:
  labnet:
