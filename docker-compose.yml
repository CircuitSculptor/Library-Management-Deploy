services:

  user-service:
    image: ghcr.io/meeeiiike/user-service/app:latest
    env_file: ./.env
    ports:
      - "8080:8080" #8083:8081
    networks:
      - labnet

  book-service:
    image: ghcr.io/meeeiiike/book-service/app:latest
    env_file: ./.env
    ports:
      - "8081:8081"
    networks:
      - labnet

  loans-service:
    image: ghcr.io/meeeiiike/loan-service/app:latest
    env_file: ./.env
    depends_on:
      - notification-service
      - user-service
    ports:
      - "8082:8082"
    networks:
      - labnet

  notification-service:
    image: ghcr.io/meeeiiike/notification-service/app:latest
    env_file: ./.env
    ports:
      - "8083:8083" #8084:8081
    networks:
      - labnet





networks:
  labnet:
